# Testes, typecheck, build e APK em todo push (para conferir que nada quebrou).
# A Release (APK assinado para instalar) só sai quando é pedida:
#   - commit com "[versao]" na PRIMEIRA linha da mensagem (é assim que o Claude publica), ou
#   - botão "Run workflow" (Actions → Android → Run workflow).
# O número e a lista do que mudou vêm de src/novidades.json (a primeira de "versoes").
# Nenhuma Release antiga é apagada.
name: Android

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      nome: ${{ steps.versao.outputs.nome }}
      codigo: ${{ steps.versao.outputs.codigo }}
      publicar: ${{ steps.versao.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Número da versão
        id: versao
        env:
          EVENTO: ${{ github.event_name }}
          MENSAGEM: ${{ github.event.head_commit.message }}
        run: |
          # versionCode: segundos desde 01/01/2026 — sempre cresce, mesmo entre branches e re-execuções.
          CODIGO=$(( $(date -u +%s) - 1767225600 ))
          V=$(node -p "require('./src/novidades.json').versoes[0].versao")
          PUBLICAR=false
          # Só a primeira linha do commit conta (o corpo pode citar a marca sem querer publicar).
          if [ "$EVENTO" = "workflow_dispatch" ] || printf '%s\n' "$MENSAGEM" | head -n 1 | grep -qF '[versao]'; then PUBLICAR=true; fi
          if [ "$PUBLICAR" = "true" ]; then
            NOME="$V"
            # Versão já publicada (ex.: botão Run workflow sem número novo): vira $V.<execução>.
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then NOME="$V.${{ github.run_number }}"; fi
          else
            NOME="$V-teste.${{ github.run_number }}"
          fi
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          echo "publicar=$PUBLICAR" >> "$GITHUB_OUTPUT"
          echo "Versão $NOME (versionCode $CODIGO), publicar: $PUBLICAR"
          if [ "$PUBLICAR" != "true" ]; then
            echo "### Sem Release: este push só confere testes e compilação. As mudanças ficam para a próxima versão." >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build da interface
        run: npx vite build
        env:
          VERSION_NAME: ${{ steps.versao.outputs.nome }}

      - name: Copiar para o projeto Android
        run: npx cap sync android

      - name: Compilar APK de release (sem assinatura)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ steps.versao.outputs.codigo }}
          VERSION_NAME: ${{ steps.versao.outputs.nome }}

      - name: Conferir que o APK não pede internet
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump permissions android/app/build/outputs/apk/release/app-release-unsigned.apk | tee permissoes.txt
          if grep -q "android.permission.INTERNET" permissoes.txt; then echo "::error::O APK declara INTERNET"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-sem-assinatura
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  publicar:
    name: Assinar e publicar Release
    needs: build
    if: needs.build.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publicar-release
      cancel-in-progress: false
    steps:
      - name: Conferir os secrets de assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          FALTA=""
          [ -z "$KS" ] && FALTA="$FALTA ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && FALTA="$FALTA ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && FALTA="$FALTA ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && FALTA="$FALTA ANDROID_KEY_PASSWORD"
          if [ -n "$FALTA" ]; then
            echo "::error title=Faltam secrets de assinatura::Cadastre em Settings → Secrets and variables → Actions → New repository secret:$FALTA. Veja o README (seção Assinatura). Os testes e a compilação passaram; só falta assinar."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: apk-sem-assinatura

      - name: Assinar
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NOME: ${{ needs.build.outputs.nome }}
        run: |
          set -o pipefail
          falha() { echo "::error title=Assinatura::$1"; exit 1; }
          # Colar pelo celular costuma trazer espaço ou quebra de linha a mais: limpa antes de usar.
          limpa() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          export KS_PASS="$(limpa "$KS_PASS")" KEY_PASS="$(limpa "$KEY_PASS")"
          ALIAS="$(limpa "$ALIAS")"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          [ -x "$BT/apksigner" ] || falha "apksigner não encontrado em $BT."
          CHAVE="$RUNNER_TEMP/chave.keystore"
          printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > "$CHAVE" 2>/dev/null \
            || falha "ANDROID_KEYSTORE_BASE64 não é um base64 válido. Cole de novo o bloco inteiro (uma linha só, sem nada antes ou depois)."
          echo "keystore: $(wc -c < "$CHAVE") bytes"
          [ "$(wc -c < "$CHAVE")" -gt 500 ] || falha "ANDROID_KEYSTORE_BASE64 parece incompleto (keystore muito pequena). Cole de novo o bloco inteiro."
          keytool -list -keystore "$CHAVE" -storetype PKCS12 -storepass:env KS_PASS > /dev/null 2>&1 \
            || falha "A senha em ANDROID_KEYSTORE_PASSWORD não abre a keystore (ou o base64 está errado)."
          keytool -list -keystore "$CHAVE" -storetype PKCS12 -storepass:env KS_PASS -alias "$ALIAS" > /dev/null 2>&1 \
            || falha "O alias em ANDROID_KEY_ALIAS não existe nesta keystore."
          "$BT/zipalign" -f 4 app-release-unsigned.apk alinhado.apk || falha "zipalign falhou."
          APK="dashboard-financeiro-v$NOME.apk"
          "$BT/apksigner" sign --ks "$CHAVE" --ks-pass env:KS_PASS --ks-key-alias "$ALIAS" --key-pass env:KEY_PASS --out "$APK" alinhado.apk \
            || falha "apksigner não conseguiu assinar (confira ANDROID_KEY_PASSWORD)."
          "$BT/apksigner" verify --print-certs "$APK" || falha "A assinatura do APK não confere."
          rm -f "$CHAVE"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Notas da Release
        env:
          NOME: ${{ needs.build.outputs.nome }}
          CODIGO: ${{ needs.build.outputs.codigo }}
        run: |
          {
            echo "**Versão $NOME** (versionCode $CODIGO), branch \`${GITHUB_REF_NAME}\`, commit ${GITHUB_SHA::7}"
            echo
            echo "### O que mudou"
            node -e '
              const n = require("./src/novidades.json"), nome = process.env.NOME, v = n.versoes[0];
              const itens = nome === v.versao ? v.itens : n.proxima.length ? n.proxima : ["Compilação nova da versão " + v.versao + ", sem mudanças listadas."];
              console.log(itens.map(i => "- " + i).join("\n"));
            '
            echo
            echo "### Como instalar"
            echo "Baixe **$APK** abaixo (em Assets) no celular e abra. Atualizações instalam por cima sem perder os dados."
          } > notas.md
          cat notas.md

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOME: ${{ needs.build.outputs.nome }}
        run: |
          TAG="v$NOME"
          if gh release view "$TAG" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG="$TAG-${{ needs.build.outputs.codigo }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Dashboard Financeiro $TAG ($GITHUB_REF_NAME)" --notes-file notas.md --latest
          echo "### Release publicada: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Espelhar no repositório de backup (opcional)
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          DESTINO: ${{ vars.BACKUP_REPO || format('{0}-backup', github.repository) }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Sem o secret BACKUP_REPO_TOKEN: espelho pulado."; exit 0; fi
          if ! GH_TOKEN="$TOKEN" gh release create "$TAG" "$APK" -R "$DESTINO" --title "Dashboard Financeiro $TAG ($GITHUB_REF_NAME)" --notes-file notas.md; then
            echo "::warning title=Espelho falhou::Não consegui criar a Release em $DESTINO. Confira se o repositório existe, tem pelo menos um commit (ex.: README) e se o token tem Contents: Read and write nele. A Release principal foi publicada normalmente."
            exit 1
          fi
          echo "Espelhado em https://github.com/$DESTINO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
