# Testes, typecheck, build e APK assinado publicado em Releases.
# Roda em push para qualquer branch e pelo botão "Run workflow" (Actions → Android → Run workflow).
# Cada execução gera uma versão nova (versionCode sempre maior) com tag e Release próprios;
# nenhuma Release antiga é apagada.
name: Android

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      nome: ${{ steps.versao.outputs.nome }}
      codigo: ${{ steps.versao.outputs.codigo }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Número da versão
        id: versao
        run: |
          # versionCode: segundos desde 01/01/2026 — sempre cresce, mesmo entre branches e re-execuções.
          CODIGO=$(( $(date -u +%s) - 1767225600 ))
          NOME="1.${{ github.run_number }}"
          if [ "${{ github.run_attempt }}" != "1" ]; then NOME="$NOME.${{ github.run_attempt }}"; fi
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          echo "Versão $NOME (versionCode $CODIGO)"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build da interface
        run: npx vite build
        env:
          VERSION_NAME: ${{ steps.versao.outputs.nome }}

      - name: Copiar para o projeto Android
        run: npx cap sync android

      - name: Compilar APK de release (sem assinatura)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ steps.versao.outputs.codigo }}
          VERSION_NAME: ${{ steps.versao.outputs.nome }}

      - name: Conferir que o APK não pede internet
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump permissions android/app/build/outputs/apk/release/app-release-unsigned.apk | tee permissoes.txt
          if grep -q "android.permission.INTERNET" permissoes.txt; then echo "::error::O APK declara INTERNET"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-sem-assinatura
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  publicar:
    name: Assinar e publicar Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publicar-release
      cancel-in-progress: false
    steps:
      - name: Conferir os secrets de assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          FALTA=""
          [ -z "$KS" ] && FALTA="$FALTA ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && FALTA="$FALTA ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && FALTA="$FALTA ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && FALTA="$FALTA ANDROID_KEY_PASSWORD"
          if [ -n "$FALTA" ]; then
            echo "::error title=Faltam secrets de assinatura::Cadastre em Settings → Secrets and variables → Actions → New repository secret:$FALTA. Veja o README (seção Assinatura). Os testes e a compilação passaram; só falta assinar."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: apk-sem-assinatura

      - name: Assinar
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NOME: ${{ needs.build.outputs.nome }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/chave.keystore"
          "$BT/zipalign" -P 16 -f 4 app-release-unsigned.apk alinhado.apk
          APK="dashboard-financeiro-v$NOME.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/chave.keystore" --ks-pass env:KS_PASS --ks-key-alias "$ALIAS" --key-pass env:KEY_PASS --out "$APK" alinhado.apk
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          rm -f "$RUNNER_TEMP/chave.keystore"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Notas da Release
        env:
          NOME: ${{ needs.build.outputs.nome }}
          CODIGO: ${{ needs.build.outputs.codigo }}
        run: |
          git fetch --tags --force --quiet
          ANT=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            echo "**Versão $NOME** (versionCode $CODIGO) · branch \`${GITHUB_REF_NAME}\` · commit ${GITHUB_SHA::7}"
            echo
            echo "### O que mudou"
            if [ -n "$ANT" ]; then
              MUD=$(git log --no-merges --pretty='- %s' "$ANT..HEAD")
              if [ -n "$MUD" ]; then echo "$MUD"; echo; echo "_Desde $ANT._"; else echo "- Nenhuma mudança de código desde $ANT (nova compilação)."; fi
            else
              git log --no-merges --pretty='- %s' -n 30 HEAD
            fi
            echo
            echo "### Como instalar"
            echo "Baixe **$APK** abaixo (em Assets) no celular e abra. Atualizações instalam por cima sem perder os dados."
          } > notas.md
          cat notas.md

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOME: ${{ needs.build.outputs.nome }}
        run: |
          TAG="v$NOME"
          if gh release view "$TAG" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG="$TAG-${{ needs.build.outputs.codigo }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Dashboard Financeiro $TAG ($GITHUB_REF_NAME)" --notes-file notas.md --latest
          echo "### Release publicada: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Espelhar no repositório de backup (opcional)
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          DESTINO: ${{ vars.BACKUP_REPO || format('{0}-backup', github.repository) }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Sem o secret BACKUP_REPO_TOKEN: espelho pulado."; exit 0; fi
          if ! GH_TOKEN="$TOKEN" gh release create "$TAG" "$APK" -R "$DESTINO" --title "Dashboard Financeiro $TAG ($GITHUB_REF_NAME)" --notes-file notas.md; then
            echo "::warning title=Espelho falhou::Não consegui criar a Release em $DESTINO. Confira se o repositório existe, tem pelo menos um commit (ex.: README) e se o token tem Contents: Read and write nele. A Release principal foi publicada normalmente."
            exit 1
          fi
          echo "Espelhado em https://github.com/$DESTINO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
